{% extends "base.html" %}

{% block content %}
<header>
  <h1>Welcome to Riget Zoo!</h1>
</header>

<div class="container">

  <!-- Left column -->
  <div>
    <h2>The Zoo</h2>
    <h5>From the night owl, to the African elephant, there is an animal for any type of person!</h5>

    <h2>Feeding Time!</h2>
    <h5>Watch your favourite animals get fed every day! Who knows, you might even learn more about them!</h5>
  </div>

  <!-- Right column: slideshow -->
  <div class="slideshow-wrapper">
    <div class="slideshow-container">

          <!-- Slides -->
          <div class="mySlides fade">
            <img src="{{ url_for('static', filename='images/owl.png') }}" alt="Owl">
          </div>
          <div class="mySlides fade">
            <img src="{{ url_for('static', filename='images/tiger.png') }}" alt="Tiger">
          </div>
          <div class="mySlides fade">
            <img src="{{ url_for('static', filename='images/elephant.png') }}" alt="Elephant">
          </div>
    </div>
<br>
    <div style="text-align:center">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    </div>
  </div>
</div>
<script>
let slideIndex = 0;
showSlides();

function showSlides() {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  slideIndex++;
  if (slideIndex > slides.length) {slideIndex = 1}
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";
  dots[slideIndex-1].className += " active";
  setTimeout(showSlides, 2000); // Change image every 4 seconds
}
</script>
{% endblock %}
