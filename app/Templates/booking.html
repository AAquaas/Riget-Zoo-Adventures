{% extends "base.html" %}

{% block content %}
 <h1>Book A Room</h1>
    <form method="post">
        <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" value="{{ current_user.fname }}"/>

        </p>
        <p>
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter your email" value="{{ current_user.email }}"/>

        </p>

        <p>
            <label for="people">Number of people:</label>
            <input type="number" id="people" name="people" placeholder="Enter the number of people staying" min="1" max="6" value="1"/>

        </p>

        <p>
            <label for="room">Room type</label>
            <select name="room" id="room">
                <option disabled selected value> -- select an option -- </option>
              <option value="single">Single person (1 person)</option>
              <option value="double">Double person (2 people)</option>
              <option value="group">Group (4 people)</option>
              <option value="vip">VIP (6 people)</option>
            </select>
        </p>

        </p>

{% endblock %}
